<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#3e4957">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Mi grupo · Awakenings</title>

    <style>
        :root {
            --fondo: #3e4957;
            --panel: #35404d;
            --panel-2: #465363;
            --linea: rgba(255,255,255,.09);
            --texto: #f6f7f9;
            --suave: #9da3af;
            --verde: #bdff78;
            --azul: #3892ff;
            --amarillo: #f4c96b;
            --rojo: #ff5f6d;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 12px;
            color: var(--texto);
            background:
                radial-gradient(circle at 15% 0%, rgba(56,146,255,.16), transparent 32%),
                radial-gradient(circle at 90% 100%, rgba(189,255,120,.09), transparent 32%),
                var(--fondo);
            font-family: Aptos, "Aptos Display", Arial, sans-serif;
        }

        button, input { font: inherit; }
        button { -webkit-tap-highlight-color: transparent; }

        .app {
            width: min(100%, 400px);
            padding: 18px;
            overflow: hidden;
            border: 1px solid var(--linea);
            border-radius: 26px;
            background: rgba(53,64,77,.96);
            box-shadow: 0 24px 80px rgba(0,0,0,.42);
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .eyebrow {
            margin: 0 0 3px;
            color: var(--verde);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .16em;
            text-transform: uppercase;
        }

        h1 { margin: 0; font-size: 22px; letter-spacing: -.04em; }

        .mi-perfil {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 9px 6px 6px;
            border: 1px solid var(--linea);
            border-radius: 999px;
            background: var(--panel-2);
            color: var(--texto);
            cursor: pointer;
        }

        .avatar {
            display: grid;
            place-items: center;
            width: 31px;
            height: 31px;
            flex: 0 0 auto;
            border-radius: 50%;
            background: linear-gradient(145deg, #65adff, var(--azul));
            color: white;
            font-size: 12px;
            font-weight: 900;
            box-shadow: 0 0 0 3px rgba(56,146,255,.16);
        }

        .avatar.amigo-avatar {
            background: linear-gradient(145deg, var(--verde), #78c837);
            color: #07120c;
            box-shadow: 0 0 0 3px rgba(119,242,173,.12);
        }

        .nickname { max-width: 75px; overflow: hidden; text-overflow: ellipsis; font-size: 12px; font-weight: 750; }

        .team-row {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-top: 18px;
        }

        .selector-label {
            flex: 0 0 auto;
            margin: 0;
            color: var(--suave);
            font-size: 12px;
            font-weight: 800;
        }

        .amigos {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .amigos::-webkit-scrollbar { display: none; }

        .amigo-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: max-content;
            padding: 7px 12px 7px 7px;
            border: 1px solid var(--linea);
            border-radius: 999px;
            background: var(--panel-2);
            color: var(--texto);
            cursor: pointer;
        }

        .amigo-chip[aria-pressed="true"] {
            border-color: rgba(56,146,255,.72);
            background: rgba(56,146,255,.11);
        }

        .amigo-chip .info { text-align: left; }
        .amigo-chip strong { display: block; font-size: 12px; }
        .amigo-chip small { color: var(--verde); font-size: 9px; }
        .amigo-chip small.offline { color: var(--rojo); }

        .escena {
            position: relative;
            height: 272px;
            margin: 14px -3px 8px;
            perspective: 760px;
        }

        .plano {
            position: absolute;
            inset: 7px 4px 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 24px;
            background:
                linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px),
                radial-gradient(circle at 75% 26%, rgba(119,242,173,.14), transparent 25%),
                radial-gradient(circle at 28% 73%, rgba(56,146,255,.16), transparent 29%),
                #303a47;
            background-size: 30px 30px, 30px 30px, auto, auto, auto;
            transform: rotateX(10deg) rotateZ(-1.2deg);
            transform-origin: center bottom;
            box-shadow: 0 22px 35px rgba(0,0,0,.35), inset 0 0 45px rgba(0,0,0,.45);
        }

        .plano::before, .plano::after {
            content: "";
            position: absolute;
            border: 1px solid rgba(255,255,255,.055);
            border-radius: 40% 60% 55% 45%;
        }

        .plano::before { width: 190px; height: 95px; left: -30px; top: 34px; transform: rotate(16deg); }
        .plano::after { width: 165px; height: 115px; right: -35px; bottom: 18px; transform: rotate(-12deg); }

        .ruta-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
            opacity: 0;
            transition: opacity .25s ease;
        }

        .ruta-svg.visible { opacity: 1; }

        #rutaSombra, #rutaCamino {
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #rutaSombra { stroke: rgba(0,0,0,.55); stroke-width: 9; }
        #rutaCamino {
            stroke: var(--verde);
            stroke-width: 4;
            stroke-dasharray: 4 11;
            filter: drop-shadow(0 0 5px rgba(119,242,173,.75));
            animation: avanzar 1.2s linear infinite;
        }

        @keyframes avanzar { to { stroke-dashoffset: -30; } }

        .marca-persona {
            position: absolute;
            z-index: 3;
            display: grid;
            justify-items: center;
            padding: 0;
            border: 0;
            background: transparent;
            color: inherit;
            font: inherit;
            cursor: pointer;
            transform: translate(-50%, -50%);
            transition: left .45s ease, top .45s ease;
        }

        .marca-persona .avatar { width: 39px; height: 39px; border: 3px solid #11141a; }

        .flecha-orientacion {
            position: absolute;
            top: -26px;
            left: 50%;
            width: 20px;
            height: 28px;
            transform: translateX(-50%) rotate(0deg);
            transform-origin: 50% 40px;
            transition: transform .16s linear;
            filter: drop-shadow(0 0 7px rgba(189,255,120,.55));
            pointer-events: none;
        }

        .flecha-orientacion::before {
            content: "";
            position: absolute;
            inset: 0;
            background: var(--verde);
            clip-path: polygon(50% 0, 100% 72%, 63% 61%, 50% 100%, 37% 61%, 0 72%);
        }
        .marca-persona span:last-child {
            margin-top: 4px;
            padding: 3px 7px;
            border-radius: 99px;
            background: rgba(9,10,13,.78);
            font-size: 9px;
            font-weight: 800;
            backdrop-filter: blur(6px);
        }

        #marcaYo { left: 50%; top: 82%; }
        #marca-feli { left: 72%; top: 28%; }
        #marca-nani { left: 25%; top: 38%; }
        #marca-joao { left: 68%; top: 60%; }

        .marca-persona.seleccionado .avatar {
            outline: 2px solid var(--azul);
            outline-offset: 3px;
        }

        .marca-persona.offline .avatar {
            background: linear-gradient(145deg, #ff8a94, var(--rojo));
            color: white;
            box-shadow: 0 0 0 3px rgba(255,95,109,.14);
        }

        .punto-reunion {
            position: absolute;
            z-index: 4;
            left: 50%;
            top: 65%;
            display: grid;
            justify-items: center;
            color: var(--verde);
            transform: translate(-50%, -50%);
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s ease, transform .35s ease;
        }

        .punto-reunion.visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .pin-reunion {
            display: grid;
            place-items: center;
            width: 36px;
            height: 36px;
            border: 2px solid var(--verde);
            border-radius: 50% 50% 50% 8px;
            background: rgba(8,30,20,.92);
            font-size: 15px;
            transform: rotate(-45deg);
            box-shadow: 0 0 22px rgba(119,242,173,.45);
        }

        .pin-reunion span { transform: rotate(45deg); }

        .punto-reunion small {
            margin-top: 7px;
            padding: 3px 7px;
            border-radius: 99px;
            background: rgba(9,10,13,.82);
            color: var(--texto);
            font-size: 8px;
            font-weight: 800;
        }

        .pulso {
            position: absolute;
            inset: -7px;
            border: 1px solid var(--verde);
            border-radius: 50%;
            animation: pulso 1.8s ease-out infinite;
        }

        @keyframes pulso { from { opacity: .8; transform: scale(.7); } to { opacity: 0; transform: scale(1.35); } }

        .norte-mini {
            position: absolute;
            top: 14px;
            left: 16px;
            color: rgba(255,255,255,.45);
            font-size: 9px;
            font-weight: 900;
            letter-spacing: .2em;
        }

        .resumen {
            position: absolute;
            z-index: 4;
            right: 12px;
            bottom: 12px;
            padding: 10px 12px;
            border: 1px solid var(--linea);
            border-radius: 14px;
            background: rgba(10,11,14,.76);
            backdrop-filter: blur(10px);
        }

        .resumen strong { display: block; font-size: 19px; letter-spacing: -.04em; }
        .resumen span { color: var(--suave); font-size: 10px; }

        .estado-fila {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 2px;
        }

        .estado-texto strong { display: block; font-size: 12px; }
        .estado-texto span { color: var(--suave); font-size: 10px; }

        .punto { color: var(--verde); }
        .punto.ultima { color: var(--rojo); }

        .boton-icono {
            width: 38px;
            height: 38px;
            border: 1px solid var(--linea);
            border-radius: 12px;
            background: var(--panel-2);
            color: white;
            cursor: pointer;
        }

        .acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 13px; }

        .reunion {
            width: 100%;
            min-height: 47px;
            margin-top: 13px;
            border: 0;
            border-radius: 14px;
            background: linear-gradient(100deg, #55e99a, #86f4b5);
            color: #06130c;
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(85,233,154,.14);
        }

        .reunion:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }

        .trazar-ruta {
            width: 100%;
            min-height: 43px;
            margin-top: 12px;
            border: 1px solid rgba(56,146,255,.48);
            border-radius: 13px;
            background: rgba(56,146,255,.13);
            color: #8fc1ff;
            font-size: 12px;
            font-weight: 850;
            cursor: pointer;
        }

        .trazar-ruta.siguiendo {
            border-color: rgba(255,95,109,.42);
            background: rgba(255,95,109,.10);
            color: #ff8a94;
        }

        .toast {
            position: fixed;
            z-index: 30;
            left: 50%;
            bottom: max(22px, env(safe-area-inset-bottom));
            width: min(calc(100% - 32px), 360px);
            padding: 13px 15px;
            border: 1px solid rgba(119,242,173,.25);
            border-radius: 14px;
            background: rgba(18,20,26,.96);
            color: var(--texto);
            text-align: center;
            font-size: 12px;
            font-weight: 750;
            box-shadow: 0 16px 50px rgba(0,0,0,.48);
            transform: translate(-50%, 30px);
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s ease, transform .25s ease;
        }

        .toast.visible { opacity: 1; transform: translate(-50%, 0); }

        .boton {
            min-height: 43px;
            border: 0;
            border-radius: 13px;
            background: var(--verde);
            color: #07120c;
            font-size: 12px;
            font-weight: 850;
            cursor: pointer;
        }

        .boton.secundario { border: 1px solid var(--linea); background: var(--panel-2); color: var(--texto); }

        .estado-sistema { min-height: 15px; margin: 9px 0 0; color: var(--suave); text-align: center; font-size: 10px; }

        details {
            margin-top: 10px;
            border-top: 1px solid var(--linea);
            color: var(--suave);
            font-size: 11px;
        }

        summary { padding: 11px 2px 1px; cursor: pointer; }
        .dev-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 9px; }
        .dev-grid button { padding: 8px 3px; border: 1px solid var(--linea); border-radius: 9px; background: var(--panel-2); color: white; font-size: 10px; }
        .dev-grid .ancho { grid-column: span 3; }

        .modal {
            position: fixed;
            z-index: 20;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 18px;
            background: rgba(5,6,8,.82);
            backdrop-filter: blur(16px);
        }

        .modal.oculto { display: none; }
        .modal-card { width: min(100%, 350px); padding: 24px; border: 1px solid var(--linea); border-radius: 24px; background: #14161c; box-shadow: 0 24px 80px #000; }
        .modal-card h2 { margin: 0 0 7px; font-size: 24px; }
        .modal-card p { margin: 0 0 18px; color: var(--suave); font-size: 12px; line-height: 1.5; }
        .modal-card label { display: block; margin-bottom: 7px; color: var(--suave); font-size: 10px; }
        .modal-card input { width: 100%; margin-bottom: 11px; padding: 13px 14px; border: 1px solid var(--linea); border-radius: 12px; outline: 0; background: #0d0f13; color: white; }
        .modal-card input:focus { border-color: var(--verde); }
        .modal-card .boton { width: 100%; }

        @media (max-height: 730px) {
            body { align-items: start; }
            .escena { height: 235px; }
            .app { padding: 15px; border-radius: 20px; }
        }
    </style>
</head>

<body>
    <main class="app">
        <header class="topbar">
            <div>
                <p class="eyebrow">Awakenings 2027</p>
                <h1>Find my team</h1>
            </div>
            <button id="editarPerfil" class="mi-perfil" aria-label="Editar nickname">
                <span id="avatarYoTop" class="avatar">YO</span>
                <span id="nicknameTop" class="nickname">Tú</span>
            </button>
        </header>

        <div class="team-row">
            <p class="selector-label">Team:</p>
            <div class="amigos">
                <button class="amigo-chip" data-amigo="feli" aria-pressed="true">
                    <span class="avatar amigo-avatar">KI</span>
                    <span class="info"><strong>KIKI</strong><small>● Live</small></span>
                </button>
                <button class="amigo-chip" data-amigo="nani" aria-pressed="false">
                    <span class="avatar amigo-avatar">AM</span>
                    <span class="info"><strong>Amelie</strong><small class="offline">● Offline</small></span>
                </button>
                <button class="amigo-chip" data-amigo="joao" aria-pressed="false">
                    <span class="avatar amigo-avatar">MA</span>
                    <span class="info"><strong>Marlon</strong><small>● Live</small></span>
                </button>
            </div>
        </div>

        <section class="escena" aria-label="Ruta abstracta hacia el integrante seleccionado">
            <div class="plano">
                <span class="norte-mini">NORTE ↑</span>
                <svg id="rutaSvg" class="ruta-svg" viewBox="0 0 360 240" preserveAspectRatio="none" aria-hidden="true">
                    <path id="rutaSombra" d="M180 205 Q235 153 260 67"/>
                    <path id="rutaCamino" d="M180 205 Q235 153 260 67"/>
                </svg>

                <div id="marcaYo" class="marca-persona">
                    <span id="flechaOrientacion" class="flecha-orientacion" aria-hidden="true"></span>
                    <span id="avatarYoMapa" class="avatar">YO</span>
                    <span id="nicknameMapa">Tú</span>
                </div>

                <button id="marca-feli" class="marca-persona marker-amigo seleccionado" data-marker="feli" aria-label="Seleccionar KIKI">
                    <span class="pulso"></span>
                    <span id="avatarAmigoMapa" class="avatar amigo-avatar">KI</span>
                    <span>KIKI</span>
                </button>

                <button id="marca-nani" class="marca-persona marker-amigo offline" data-marker="nani" aria-label="Seleccionar Amelie">
                    <span class="pulso" style="display:none"></span>
                    <span class="avatar amigo-avatar">AM</span>
                    <span>Amelie</span>
                </button>

                <button id="marca-joao" class="marca-persona marker-amigo" data-marker="joao" aria-label="Seleccionar Marlon">
                    <span class="pulso"></span>
                    <span class="avatar amigo-avatar">MA</span>
                    <span>Marlon</span>
                </button>

                <div id="puntoReunion" class="punto-reunion">
                    <span class="pin-reunion"><span>●</span></span>
                    <small>REUNIÓN</small>
                </div>

                <div class="resumen">
                    <strong id="distanciaAmigo">-- m</strong>
                    <span id="direccionAmigo">Esperando ubicación</span>
                </div>
            </div>
        </section>

        <div class="estado-fila">
            <div class="estado-texto">
                <strong><span id="puntoEstado" class="punto">●</span> <span id="estadoAmigo">Live</span></strong>
                <span id="ultimaConexionAmigo">Ubicación actual de KIKI</span>
            </div>
            <button id="botonEstadoAmigo" class="boton-icono" title="Simular cierre de app">◉</button>
        </div>

        <button id="botonRuta" class="trazar-ruta">Trazar ruta hacia KIKI</button>

        <button id="botonReunion" class="reunion" disabled>⌖ &nbsp; Reunirse aquí</button>

        <div class="acciones">
            <button id="botonUbicacion" class="boton">Activar ubicación</button>
            <button id="botonBrujula" class="boton secundario">Activar orientación</button>
        </div>

        <p id="estado" class="estado-sistema">Activa tu ubicación para comenzar</p>
        <p id="estadoBrujula" class="estado-sistema"></p>

        <details>
            <summary>Controles de demostración</summary>
            <div class="dev-grid">
                <button data-direccion="norte">Amigo ↑ 20 m</button>
                <button data-direccion="oeste">Amigo ← 20 m</button>
                <button data-direccion="este">Amigo → 20 m</button>
                <button data-direccion="sur">Amigo ↓ 20 m</button>
                <button id="girarIzquierda">Girar ↶ 15°</button>
                <button id="girarDerecha">Girar 15° ↷</button>
                <button id="botonReiniciar" class="ancho">Reiniciar demostración</button>
            </div>
            <div id="mensajeMovimiento" class="estado-sistema"></div>
        </details>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <div id="modalPerfil" class="modal">
        <form id="formPerfil" class="modal-card">
            <p class="eyebrow">Tu identidad en el grupo</p>
            <h2>Elige tu nickname</h2>
            <p>Tus amigos verán este nombre junto a tu icono. Puedes cambiarlo después.</p>
            <label for="inputNickname">NICKNAME</label>
            <input id="inputNickname" maxlength="14" placeholder="Ej: Keyjoo" autocomplete="nickname" required>
            <button class="boton" type="submit">Entrar al grupo</button>
        </form>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);
        const botonUbicacion = $("botonUbicacion");
        const botonBrujula = $("botonBrujula");
        const estado = $("estado");
        const estadoBrujula = $("estadoBrujula");
        const distanciaAmigo = $("distanciaAmigo");
        const direccionAmigo = $("direccionAmigo");
        const rutaSvg = $("rutaSvg");
        const rutaCamino = $("rutaCamino");
        const rutaSombra = $("rutaSombra");
        const estadoAmigo = $("estadoAmigo");
        const ultimaConexionAmigo = $("ultimaConexionAmigo");
        const puntoEstado = $("puntoEstado");
        const botonEstadoAmigo = $("botonEstadoAmigo");
        const mensajeMovimiento = $("mensajeMovimiento");
        const modalPerfil = $("modalPerfil");
        const inputNickname = $("inputNickname");
        const botonReunion = $("botonReunion");
        const botonRuta = $("botonRuta");
        const puntoReunion = $("puntoReunion");
        const toast = $("toast");
        const flechaOrientacion = $("flechaOrientacion");

        let seguimientoActivo = false;
        let idSeguimientoUbicacion = null;
        let ubicacionAutorizada = false;
        let miUbicacion = null;
        let rumboAmigo = 0;
        let orientacionTelefono = 0;
        let sensorBrujulaActivo = false;
        let ubicacionReunion = null;
        let temporizadorToast = null;
        let amigoSeleccionado = "feli";
        let rutaActiva = false;

        const amigosSimulados = {
            feli: {
                nombre: "KIKI", iniciales: "KI", enVivo: true,
                latitud: null, longitud: null,
                desplazamientoNorte: 70, desplazamientoEste: 70,
                ultimaActualizacion: new Date()
            },
            nani: {
                nombre: "Amelie", iniciales: "AM", enVivo: false,
                latitud: null, longitud: null,
                desplazamientoNorte: 35, desplazamientoEste: -95,
                ultimaActualizacion: new Date(Date.now() - 4 * 60 * 1000)
            },
            joao: {
                nombre: "Marlon", iniciales: "MA", enVivo: true,
                latitud: null, longitud: null,
                desplazamientoNorte: -80, desplazamientoEste: 45,
                ultimaActualizacion: new Date()
            }
        };

        const nicknameGuardado = localStorage.getItem("awakeningsNickname");
        if (nicknameGuardado) {
            aplicarNickname(nicknameGuardado);
            modalPerfil.classList.add("oculto");
        }

        $("formPerfil").addEventListener("submit", (evento) => {
            evento.preventDefault();
            const nickname = inputNickname.value.trim();
            if (!nickname) return;
            localStorage.setItem("awakeningsNickname", nickname);
            aplicarNickname(nickname);
            modalPerfil.classList.add("oculto");
        });

        $("editarPerfil").addEventListener("click", () => {
            inputNickname.value = localStorage.getItem("awakeningsNickname") || "";
            modalPerfil.classList.remove("oculto");
            setTimeout(() => inputNickname.focus(), 50);
        });

        botonUbicacion.addEventListener("click", activarUbicacion);
        botonBrujula.addEventListener("click", activarBrujulaReal);
        botonEstadoAmigo.addEventListener("click", alternarEstadoAmigo);
        botonReunion.addEventListener("click", crearPuntoReunion);
        botonRuta.addEventListener("click", alternarRuta);
        $("botonReiniciar").addEventListener("click", reiniciarAmigo);
        $("girarIzquierda").addEventListener("click", () => girarTelefono(-15));
        $("girarDerecha").addEventListener("click", () => girarTelefono(15));
        document.querySelectorAll("[data-direccion]").forEach((boton) => {
            boton.addEventListener("click", () => moverAmigo(boton.dataset.direccion));
        });
        document.querySelectorAll("[data-amigo]").forEach((boton) => {
            boton.addEventListener("click", () => seleccionarAmigo(boton.dataset.amigo));
        });
        document.querySelectorAll("[data-marker]").forEach((boton) => {
            boton.addEventListener("click", () => seleccionarAmigo(boton.dataset.marker));
        });
        document.addEventListener("visibilitychange", manejarVisibilidad);
        window.addEventListener("pagehide", detenerSeguimiento);
        setInterval(actualizarTextoUltimaConexion, 1000);

        function aplicarNickname(nickname) {
            const iniciales = nickname.slice(0, 2).toUpperCase();
            $("nicknameTop").textContent = nickname;
            $("nicknameMapa").textContent = nickname;
            $("avatarYoTop").textContent = iniciales;
            $("avatarYoMapa").textContent = iniciales;
        }

        function activarUbicacion() {
            if (!navigator.geolocation) {
                estado.textContent = "Este navegador no permite obtener la ubicación";
                return;
            }
            estado.textContent = "Buscando tu ubicación...";
            iniciarSeguimiento();
            activarBrujulaReal();
        }

        function iniciarSeguimiento() {
            if (seguimientoActivo || document.hidden) return;
            seguimientoActivo = true;
            idSeguimientoUbicacion = navigator.geolocation.watchPosition(
                mostrarUbicacion,
                mostrarError,
                { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
            );
        }

        function detenerSeguimiento() {
            if (idSeguimientoUbicacion !== null) {
                navigator.geolocation.clearWatch(idSeguimientoUbicacion);
                idSeguimientoUbicacion = null;
            }
            seguimientoActivo = false;
        }

        function manejarVisibilidad() {
            if (document.hidden) {
                detenerSeguimiento();
            } else if (ubicacionAutorizada) {
                estado.textContent = "Reanudando ubicación en vivo...";
                iniciarSeguimiento();
            }
        }

        function mostrarUbicacion(posicion) {
            ubicacionAutorizada = true;
            miUbicacion = {
                latitud: posicion.coords.latitude,
                longitud: posicion.coords.longitude,
                precision: posicion.coords.accuracy
            };
            estado.textContent = `Ubicación activa · precisión ${Math.round(miUbicacion.precision)} m`;
            botonUbicacion.textContent = "Ubicación activa";
            botonReunion.disabled = false;
            if (amigosSimulados.feli.latitud === null) crearAmigosIniciales();
            actualizarDatosAmigo();
        }

        async function activarBrujulaReal() {
            if (typeof DeviceOrientationEvent === "undefined") {
                estadoBrujula.textContent = "Sensor no disponible; usa los controles de demostración";
                return;
            }
            try {
                if (typeof DeviceOrientationEvent.requestPermission === "function") {
                    const permiso = await DeviceOrientationEvent.requestPermission();
                    if (permiso !== "granted") {
                        estadoBrujula.textContent = "Permiso de orientación no autorizado";
                        return;
                    }
                }
                window.addEventListener("deviceorientation", manejarOrientacion, true);
                estadoBrujula.textContent = "Orientación del dispositivo activa";
                botonBrujula.textContent = "Orientación activa";
            } catch {
                estadoBrujula.textContent = "No fue posible activar la orientación";
            }
        }

        function manejarOrientacion(evento) {
            let orientacion = null;
            if (typeof evento.webkitCompassHeading === "number") {
                orientacion = evento.webkitCompassHeading;
            } else if (typeof evento.alpha === "number") {
                orientacion = 360 - evento.alpha;
            }
            if (orientacion === null) return;
            sensorBrujulaActivo = true;
            orientacionTelefono = normalizarAngulo(orientacion);
            actualizarFlechaOrientacion();
            actualizarDatosAmigo();
        }

        function crearAmigosIniciales() {
            Object.values(amigosSimulados).forEach((amigo) => {
                amigo.latitud = miUbicacion.latitud + metrosALatitud(amigo.desplazamientoNorte);
                amigo.longitud = miUbicacion.longitud + metrosALongitud(amigo.desplazamientoEste, miUbicacion.latitud);
                if (amigo.enVivo) amigo.ultimaActualizacion = new Date();
            });
        }

        function obtenerAmigoActual() {
            return amigosSimulados[amigoSeleccionado];
        }

        function seleccionarAmigo(idAmigo) {
            amigoSeleccionado = idAmigo;
            const amigo = obtenerAmigoActual();
            rutaActiva = false;
            rutaSvg.classList.remove("visible");

            document.querySelectorAll("[data-amigo]").forEach((boton) => {
                boton.setAttribute("aria-pressed", String(boton.dataset.amigo === idAmigo));
            });

            document.querySelectorAll("[data-marker]").forEach((marcador) => {
                marcador.classList.toggle("seleccionado", marcador.dataset.marker === idAmigo);
            });

            botonRuta.classList.remove("siguiendo");
            botonRuta.textContent = `Trazar ruta hacia ${amigo.nombre}`;
            actualizarTextoUltimaConexion();
            actualizarDatosAmigo();
        }

        function alternarRuta() {
            if (!miUbicacion) {
                mostrarToast("Primero debes activar tu ubicación");
                return;
            }

            const amigo = obtenerAmigoActual();
            rutaActiva = !rutaActiva;
            botonRuta.classList.toggle("siguiendo", rutaActiva);
            botonRuta.textContent = rutaActiva
                ? "Dejar de seguir"
                : `Trazar ruta hacia ${amigo.nombre}`;
            actualizarDatosAmigo();
        }

        function moverAmigo(direccion) {
            const amigo = obtenerAmigoActual();
            if (!miUbicacion || amigo.latitud === null) {
                mensajeMovimiento.textContent = "Primero activa tu ubicación";
                return;
            }
            if (!amigo.enVivo) {
                mensajeMovimiento.textContent = `${amigo.nombre} está Offline: su ubicación no cambia`;
                return;
            }
            const metros = 20;
            const lat = metrosALatitud(metros);
            const lon = metrosALongitud(metros, amigo.latitud);
            if (direccion === "norte") amigo.latitud += lat;
            if (direccion === "sur") amigo.latitud -= lat;
            if (direccion === "este") amigo.longitud += lon;
            if (direccion === "oeste") amigo.longitud -= lon;
            amigo.ultimaActualizacion = new Date();
            mensajeMovimiento.textContent = `${amigo.nombre} se movió 20 m hacia el ${direccion}`;
            actualizarDatosAmigo();
        }

        function girarTelefono(grados) {
            sensorBrujulaActivo = false;
            orientacionTelefono = normalizarAngulo(orientacionTelefono + grados);
            actualizarFlechaOrientacion();
            mensajeMovimiento.textContent = `Orientación simulada: ${Math.round(orientacionTelefono)}°`;
            actualizarDatosAmigo();
        }

        function actualizarFlechaOrientacion() {
            flechaOrientacion.style.transform = `translateX(-50%) rotate(${orientacionTelefono}deg)`;
            flechaOrientacion.setAttribute("title", `Dirección del teléfono: ${Math.round(orientacionTelefono)}°`);
        }

        function reiniciarAmigo() {
            if (!miUbicacion) {
                mensajeMovimiento.textContent = "Primero activa tu ubicación";
                return;
            }
            amigosSimulados.feli.enVivo = true;
            amigosSimulados.nani.enVivo = false;
            amigosSimulados.joao.enVivo = true;
            amigosSimulados.nani.ultimaActualizacion = new Date(Date.now() - 4 * 60 * 1000);
            crearAmigosIniciales();
            sincronizarChips();
            mensajeMovimiento.textContent = "Demostración reiniciada";
            actualizarTextoUltimaConexion();
            actualizarDatosAmigo();
        }

        function actualizarDatosAmigo() {
            const amigo = obtenerAmigoActual();
            if (!miUbicacion || amigo.latitud === null) return;
            actualizarTodosLosMarcadores();
            const distancia = calcularDistancia(
                miUbicacion.latitud, miUbicacion.longitud,
                amigo.latitud, amigo.longitud
            );
            rumboAmigo = calcularRumbo(
                miUbicacion.latitud, miUbicacion.longitud,
                amigo.latitud, amigo.longitud
            );
            const anguloRelativo = normalizarAngulo(rumboAmigo - orientacionTelefono);
            distanciaAmigo.textContent = formatearDistancia(distancia);
            direccionAmigo.textContent = `${obtenerDireccion(rumboAmigo)} · ${Math.round(rumboAmigo)}°`;
            if (rutaActiva) {
                actualizarRuta(anguloRelativo, distancia);
                rutaSvg.classList.add("visible");
            } else {
                rutaSvg.classList.remove("visible");
            }
        }

        function calcularPosicionVisual(angulo, distancia) {
            const rad = gradosARadianes(angulo);
            const radio = Math.min(112, 48 + distancia * .35);
            const inicioX = 180;
            const inicioY = 205;
            const destinoX = limitar(inicioX + Math.sin(rad) * radio, 42, 318);
            const destinoY = limitar(inicioY - Math.cos(rad) * radio, 38, 178);
            return { inicioX, inicioY, destinoX, destinoY, rad };
        }

        function actualizarTodosLosMarcadores() {
            Object.entries(amigosSimulados).forEach(([id, amigo]) => {
                if (amigo.latitud === null) return;
                const distancia = calcularDistancia(
                    miUbicacion.latitud, miUbicacion.longitud,
                    amigo.latitud, amigo.longitud
                );
                const rumbo = calcularRumbo(
                    miUbicacion.latitud, miUbicacion.longitud,
                    amigo.latitud, amigo.longitud
                );
                const angulo = normalizarAngulo(rumbo - orientacionTelefono);
                const posicion = calcularPosicionVisual(angulo, distancia);
                const marcador = $(`marca-${id}`);
                marcador.style.left = `${posicion.destinoX / 3.6}%`;
                marcador.style.top = `${posicion.destinoY / 2.4}%`;
                marcador.classList.toggle("offline", !amigo.enVivo);
                marcador.querySelector(".pulso").style.display = amigo.enVivo ? "block" : "none";
            });
        }

        function actualizarRuta(angulo, distancia) {
            const posicion = calcularPosicionVisual(angulo, distancia);
            const { inicioX, inicioY, destinoX, destinoY, rad } = posicion;
            const curvaX = (inicioX + destinoX) / 2 + Math.cos(rad) * 27;
            const curvaY = (inicioY + destinoY) / 2 + Math.sin(rad) * 18;
            const ruta = `M${inicioX} ${inicioY} Q${curvaX.toFixed(1)} ${curvaY.toFixed(1)} ${destinoX.toFixed(1)} ${destinoY.toFixed(1)}`;
            rutaCamino.setAttribute("d", ruta);
            rutaSombra.setAttribute("d", ruta);
        }

        function alternarEstadoAmigo() {
            const amigo = obtenerAmigoActual();
            amigo.enVivo = !amigo.enVivo;
            if (amigo.enVivo) {
                amigo.ultimaActualizacion = new Date();
                mensajeMovimiento.textContent = `${amigo.nombre} ahora está Live`;
            } else {
                amigo.ultimaActualizacion = new Date();
                mensajeMovimiento.textContent = `${amigo.nombre} ahora está Offline`;
            }
            sincronizarChips();
            actualizarTextoUltimaConexion();
            if (miUbicacion) actualizarDatosAmigo();
        }

        function sincronizarChips() {
            document.querySelectorAll("[data-amigo]").forEach((boton) => {
                const amigo = amigosSimulados[boton.dataset.amigo];
                const etiqueta = boton.querySelector("small");
                etiqueta.textContent = amigo.enVivo ? "● Live" : "● Offline";
                etiqueta.classList.toggle("offline", !amigo.enVivo);
            });
        }

        async function crearPuntoReunion() {
            if (!miUbicacion) {
                mostrarToast("Primero debes activar tu ubicación");
                return;
            }

            ubicacionReunion = {
                latitud: miUbicacion.latitud,
                longitud: miUbicacion.longitud,
                creadoPor: localStorage.getItem("awakeningsNickname") || "Alguien",
                fecha: new Date()
            };

            puntoReunion.classList.add("visible");
            botonReunion.textContent = "✓  Punto enviado al grupo";
            mostrarToast(`${ubicacionReunion.creadoPor} quiere reunirse aquí · aviso enviado`);
            await mostrarNotificacionDemo(ubicacionReunion.creadoPor);
        }

        async function mostrarNotificacionDemo(nickname) {
            if (!("Notification" in window) || !("serviceWorker" in navigator)) return;

            try {
                let permiso = Notification.permission;
                if (permiso === "default") permiso = await Notification.requestPermission();
                if (permiso !== "granted") return;

                const registro = await navigator.serviceWorker.ready;
                await registro.showNotification("Punto de encuentro", {
                    body: `${nickname} quiere reunirse aquí`,
                    icon: "./icon-192.png",
                    badge: "./icon-192.png",
                    tag: "punto-reunion",
                    data: { url: "./" }
                });
            } catch {
                // La notificación visual dentro de la app sigue funcionando.
            }
        }

        function mostrarToast(mensaje) {
            toast.textContent = mensaje;
            toast.classList.add("visible");
            clearTimeout(temporizadorToast);
            temporizadorToast = setTimeout(() => toast.classList.remove("visible"), 3200);
        }

        function actualizarTextoUltimaConexion() {
            const amigo = obtenerAmigoActual();
            const marcador = $(`marca-${amigoSeleccionado}`);
            if (amigo.enVivo) {
                puntoEstado.classList.remove("ultima");
                estadoAmigo.textContent = "Live";
                ultimaConexionAmigo.textContent = `Ubicación actual de ${amigo.nombre}`;
                marcador.querySelector(".pulso").style.display = "block";
                return;
            }
            const segundos = Math.max(0, Math.floor((Date.now() - amigo.ultimaActualizacion.getTime()) / 1000));
            puntoEstado.classList.add("ultima");
            estadoAmigo.textContent = "Offline";
            ultimaConexionAmigo.textContent = formatearAntiguedad(segundos);
            marcador.querySelector(".pulso").style.display = "none";
        }

        function formatearAntiguedad(segundos) {
            if (segundos < 5) return "Actualizada ahora";
            if (segundos < 60) return `Actualizada hace ${segundos} s`;
            const minutos = Math.floor(segundos / 60);
            if (minutos < 60) return `Actualizada hace ${minutos} min`;
            return `Actualizada hace ${Math.floor(minutos / 60)} h`;
        }

        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const r = 6371000;
            const p1 = gradosARadianes(lat1);
            const p2 = gradosARadianes(lat2);
            const dp = gradosARadianes(lat2 - lat1);
            const dl = gradosARadianes(lon2 - lon1);
            const a = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
            return r * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function calcularRumbo(lat1, lon1, lat2, lon2) {
            const p1 = gradosARadianes(lat1);
            const p2 = gradosARadianes(lat2);
            const dl = gradosARadianes(lon2 - lon1);
            const y = Math.sin(dl) * Math.cos(p2);
            const x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
            return normalizarAngulo(Math.atan2(y, x) * 180 / Math.PI);
        }

        function obtenerDireccion(angulo) {
            const direcciones = ["Norte", "Noreste", "Este", "Sureste", "Sur", "Suroeste", "Oeste", "Noroeste"];
            return direcciones[Math.round(angulo / 45) % 8];
        }

        function normalizarAngulo(angulo) { return ((angulo % 360) + 360) % 360; }
        function gradosARadianes(grados) { return grados * Math.PI / 180; }
        function metrosALatitud(metros) { return metros / 111320; }
        function metrosALongitud(metros, latitud) { return metros / (111320 * Math.cos(gradosARadianes(latitud))); }
        function limitar(valor, minimo, maximo) { return Math.max(minimo, Math.min(maximo, valor)); }
        function formatearDistancia(distancia) { return distancia < 1000 ? `${Math.round(distancia)} m` : `${(distancia / 1000).toFixed(2)} km`; }

        function mostrarError(error) {
            seguimientoActivo = false;
            if (error.code === 1) estado.textContent = "No autorizaste el acceso a la ubicación";
            else if (error.code === 2) estado.textContent = "No fue posible determinar tu ubicación";
            else if (error.code === 3) estado.textContent = "La ubicación tardó demasiado";
            else estado.textContent = "Ocurrió un error con la ubicación";
        }

        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js"));
        }
    </script>
</body>
</html>
